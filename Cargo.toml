[package]
name = "rednext"
version = "0.1.1"
edition = "2024"
authors = ["Mike Limansky <mike.limansky@gmail.com>"]
repository = "https://github.com/limansky/rednext"
license = "MIT"
description = "A command-line tool for managing tasks in random order."
keywords = ["task", "todo", "cli", "random"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.8"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "8.0.1"
console = "0.16.3"
csv = "1.4.0"
dialoguer = "0.12.0"
dirs = "7.0.0"
reqwest = { version = "0.13.5", features = ["json", "blocking", "query"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
sqlx = { version = "0.8.6", features = ["chrono", "runtime-tokio", "sqlite"] }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
